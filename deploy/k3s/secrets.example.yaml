# Copy to secrets.yaml, fill in real values, and apply that instead -- never commit the
# filled-in version (docs/DEVOPS.md §3: sealed with SOPS + age in the real pipeline; a plain
# Secret here is the placeholder until that's wired up).
apiVersion: v1
kind: Secret
metadata:
  name: spotlys-secrets
  namespace: spotlys
type: Opaque
stringData:
  ConnectionStrings__Spotlys: "Host=postgres;Port=5432;Database=spotlys;Username=spotlys;Password=CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
