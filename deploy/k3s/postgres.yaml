apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: spotlys
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: spotlys
spec:
  replicas: 1
  strategy:
    type: Recreate # single PVC, no rolling update for a stateful single-node Postgres
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: spotlys
            - name: POSTGRES_USER
              value: spotlys
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: spotlys-secrets, key: POSTGRES_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "spotlys"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: spotlys
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
